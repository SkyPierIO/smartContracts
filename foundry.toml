[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# OpenZeppelin's upgrade checks read these.
ast = true
build_info = true
extra_output = ["storageLayout"]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64

[profile.ci.fuzz]
runs = 10000

[fmt]
line_length = 120
